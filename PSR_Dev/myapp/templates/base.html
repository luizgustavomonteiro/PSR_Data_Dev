<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <!-- Load static files -->
    {% load static %}
    <link rel="icon" type="image-png" href="{% static 'usf-favicon.png' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <!-- Chart.js for graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
   
    <div class="divided-container">
        <div class="left-section">
            <img src="{% static 'img/Science.png' %}" width="70mm" alt="Science-Logo">
        </div>
        
        <div class="right-section">
            <img src="{% static 'img/usf-logo.png' %}" width="46mm" alt="USF-Logo">
        </div>
    </div>
   {% block content %}
   {% endblock %}
      <div class="side-menu-collapsible">
         <ul>
            <li>
               <a href="{% url 'home' %}">
                  <i class="bi bi-house"></i>
                  <span class="label">Home</span>
               </a>
            </li>
            <li>
               <a href="{% url 'graphics' %}">
                  <i class="bi bi-graph-up-arrow"></i>
                  <span class="label">Graphics</span>
               </a>
            </li>
            <li>
               <a href="{% url 'maps' %}">
                  <i class="bi bi-globe-americas"></i>
                  <span class="label">Maps</span>
               </a>
            </li>
            <li>
               <a href="#">
               <i class="bi bi-person-fill-gear"></i>
               <span class="label">Dev Team</span>
            </a>
         </li>
         <li></li>
         <li></li>
         <li></li>
         <li></li>
         <li></li>
         <li></li>
         <li></li>

         </ul>
      </div>

            
 
    <script>
        document.addEventListener('DOMContentLoaded', () => {
          const bubbleContainer = document.querySelector('.custom-header .bubbles');
          const bubbleCount = 7; // Número de bolhas
        
          for (let i = 0; i < bubbleCount; i++) {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            
            // Valores aleatórios (simulando o Sass)
            bubble.style.setProperty('--bubble-left-offset', `${Math.random() * 100}vw`);
            bubble.style.setProperty('--bubble-radius', `${1 + Math.random() * 9}vw`);
            bubble.style.setProperty('--bubble-float-duration', `${10 + Math.random() * 5}s`);
            bubble.style.setProperty('--bubble-sway-duration', `${4 + Math.random() * 2}s`);
            bubble.style.setProperty('--bubble-float-delay', `${Math.random() * 4}s`);
            bubble.style.setProperty('--bubble-sway-delay', `${Math.random() * 4}s`);
            bubble.style.setProperty('--bubble-sway-type', 
              Math.random() > 0.5 ? 'sway-left-to-right' : 'sway-right-to-left');
            
            bubbleContainer.appendChild(bubble);
          }
        });
        </script>
</body>
</html>
